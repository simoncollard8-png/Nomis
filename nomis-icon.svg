<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#080810"/>
      <stop offset="100%" style="stop-color:#0e0e1a"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c8ff5"/>
      <stop offset="100%" style="stop-color:#5b6af0"/>
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glow-filter">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="url(#bg)"/>

  <!-- Outer ring arc - top -->
  <path d="M 256 48 A 208 208 0 0 1 464 256" fill="none" stroke="#5b6af0" stroke-width="1.5" stroke-opacity="0.4"/>
  <!-- Outer ring arc - bottom -->
  <path d="M 48 256 A 208 208 0 0 1 256 464" fill="none" stroke="#5b6af0" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Inner ring arc -->
  <path d="M 256 80 A 176 176 0 0 1 432 256" fill="none" stroke="#7c8ff5" stroke-width="1" stroke-opacity="0.25"/>
  <path d="M 80 256 A 176 176 0 0 1 256 432" fill="none" stroke="#7c8ff5" stroke-width="1" stroke-opacity="0.25"/>

  <!-- Corner tick marks -->
  <line x1="256" y1="48" x2="256" y2="62" stroke="#5b6af0" stroke-width="2" stroke-opacity="0.8"/>
  <line x1="464" y1="256" x2="450" y2="256" stroke="#5b6af0" stroke-width="2" stroke-opacity="0.8"/>
  <line x1="256" y1="464" x2="256" y2="450" stroke="#5b6af0" stroke-width="2" stroke-opacity="0.8"/>
  <line x1="48" y1="256" x2="62" y2="256" stroke="#5b6af0" stroke-width="2" stroke-opacity="0.8"/>

  <!-- Glow orb behind text -->
  <ellipse cx="256" cy="256" rx="140" ry="60" fill="#5b6af0" opacity="0.06" filter="url(#blur)"/>

  <!-- NOMIS text -->
  <text
    x="256"
    y="278"
    text-anchor="middle"
    font-family="'Arial Black', 'Helvetica Neue', sans-serif"
    font-weight="900"
    font-size="88"
    letter-spacing="18"
    fill="url(#glow)"
    filter="url(#glow-filter)"
  >NOMIS</text>

  <!-- Thin underline -->
  <line x1="96" y1="300" x2="416" y2="300" stroke="#5b6af0" stroke-width="1" stroke-opacity="0.3"/>

  <!-- Subtitle -->
  <text
    x="256"
    y="324"
    text-anchor="middle"
    font-family="'Courier New', monospace"
    font-size="18"
    letter-spacing="8"
    fill="#555570"
  >PERSONAL AI OS</text>

  <!-- Corner decorations -->
  <path d="M 48 80 L 48 48 L 80 48" fill="none" stroke="#5b6af0" stroke-width="2" stroke-opacity="0.5"/>
  <path d="M 464 80 L 464 48 L 432 48" fill="none" stroke="#5b6af0" stroke-width="2" stroke-opacity="0.5"/>
  <path d="M 48 432 L 48 464 L 80 464" fill="none" stroke="#5b6af0" stroke-width="2" stroke-opacity="0.5"/>
  <path d="M 464 432 L 464 464 L 432 464" fill="none" stroke="#5b6af0" stroke-width="2" stroke-opacity="0.5"/>

  <!-- Status dot -->
  <circle cx="256" cy="352" r="4" fill="#22d48a" opacity="0.9"/>
  <circle cx="256" cy="352" r="8" fill="none" stroke="#22d48a" stroke-width="1" opacity="0.3"/>
</svg>
