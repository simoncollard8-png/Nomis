<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nomis</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0f;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      flex-direction: column;
      gap: 16px;
    }
    .status { display: flex; align-items: center; gap: 8px; }
    .dot {
      width: 10px; height: 10px;
      background: #22c55e;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    h1 { font-size: 3rem; font-weight: 700; letter-spacing: 0.2em; color: #fff; }
    p { color: #64748b; font-size: 0.95rem; letter-spacing: 0.05em; }
  </style>
</head>
<body>
  <h1>NOMIS</h1>
  <div class="status">
    <div class="dot"></div>
    <span>Core Online</span>
  </div>
  <p>Personal AI Operating System — Initializing</p>
</body>
</html>
